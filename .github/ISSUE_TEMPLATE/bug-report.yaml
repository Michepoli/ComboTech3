name: Bug Report
description: You found a bug
labels: [bug]
assignees: Michepoli
body:
  - type: checkboxes
    id: optional
    attributes:
      label: This issue has already been reported?
      description: Check if your issue is already reported
      options:
        - label: -Yes
          required: false
          
  - type: dropdown
    id: list-selection
    attributes:
      label: Quests chapter
      description: Select the name of the quests chapter
      options:
        - No Chapter
        - Introduction
        - Primitive 1
        - Primitive 2
        - Steam 1
        - Steam 2
        - RF1
        - RF2
        - RF3
        - RF4
        - RF5
        - RF6
        - RF7
    validations:
      required: true
  
  - type: textarea
    id: large-text-box
    attributes:
      label: Description
      description: Write down the issue you have found and its steps to reproduce it
      placeholder: example
    validations:
      required: true
      
